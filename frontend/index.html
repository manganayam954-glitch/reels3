<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>reels3 — multi-platform reels downloader</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap">
    <div class="lang-bar">
      <select id="lang-select" aria-label="Language">
        <option value="id">🇮🇩 Indonesia</option>
        <option value="en">🇬🇧 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>

    <header>
      <div class="logo">reels<span>3</span></div>
      <p class="tagline" data-i18n="tagline">Download Reels dari YouTube, Instagram, Facebook, TikTok, Douyin. Tanpa login, tanpa watermark, tanpa drama.</p>
    </header>

    <section class="card input-card">
      <form id="form" autocomplete="off">
        <input
          type="url"
          id="url"
          data-i18n-placeholder="placeholder"
          placeholder="Tempel URL video di sini..."
          required
          autofocus
        />
        <button type="submit" id="submit-btn">
          <span class="btn-text" data-i18n="btn">Ambil video</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </form>
      <div class="badges">
        <span class="badge yt">YouTube Shorts</span>
        <span class="badge ig">Instagram</span>
        <span class="badge fb">Facebook</span>
        <span class="badge tt">TikTok</span>
        <span class="badge dy">Douyin</span>
      </div>
    </section>

    <section id="result" class="card result-card" hidden></section>
    <section id="error" class="card error-card" hidden></section>

    <footer>
      <p>
        <span data-i18n="footer1">Built with public broker chain. No accounts. No tracking.</span> <br />
        <a href="https://github.com/manganayam954-glitch/reels3" target="_blank" rel="noopener">source on github</a>
      </p>
      <p class="signature">
        <span data-i18n="dev_by">Dikembangkan oleh</span>
        <strong>Rury</strong>
        <span class="sig-mark">✦</span>
      </p>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
